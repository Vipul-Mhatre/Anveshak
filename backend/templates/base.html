<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title if title else "Surveillance Dashboard" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
  </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button">
          <i class="fas fa-bars"></i>
        </a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="/" class="nav-link">Home</a>
      </li>
    </ul>
  </nav>
  
  
  
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    
    <a href="/" class="brand-link">
      <img src="/static/assets/logo.png" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
      <span class="brand-text font-weight-light">Surveillance</span>
    </a>
    
    <div class="sidebar">
      
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item">
            <a href="/upload" class="nav-link">
              <i class="nav-icon fas fa-upload"></i>
              <p>Upload Video</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/video_feed?source=your_source" class="nav-link">
              <i class="nav-icon fas fa-video"></i>
              <p>Live Feed</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/api/get_performance_report" class="nav-link">
              <i class="nav-icon fas fa-chart-line"></i>
              <p>Performance Report</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/download_log" class="nav-link">
              <i class="nav-icon fas fa-file-csv"></i>
              <p>Download Logs</p>
            </a>
          </li>
        </ul>
      </nav>
      
    </div>
    
  </aside>
  
  
  <div class="content-wrapper">
    {% block content %}
    {% endblock %}
  </div>
  
  
  
  <footer class="main-footer">
    <strong>&copy; 2025 Surveillance System.</strong> All rights reserved.
  </footer>
</div>



<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
